name: 自动化测试持续集成

# 触发条件：当代码推送到 main 或 master 分支时自动运行
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  api-tests:
    name: 执行 API 接口测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Playwright 浏览器
        run: |
          playwright install --with-deps chromium

      - name: 运行 API 测试
        run: |
          pytest -m api --alluredir=allure-results

      - name: 上传 Allure 测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-api
          path: allure-results
  ui-tests:
     name: 执行 UI 界面测试
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       - name: 安装 Python
         uses: actions/setup-python@v5
         with:
           python-version: '3.11'
       - name: 安装依赖
         run: |
           pip install -r requirements.txt
       - name: 安装 Playwright 浏览器
         run: |
           playwright install --with-deps chromium
       - name: 运行 UI 测试
         run: |
           pytest -m ui --alluredir=allure-ui-results
       - name: 上传 Allure 报告
         uses: actions/upload-artifact@v4
         if: always()
         with:
           name: allure-report-ui
           path: allure-ui-results